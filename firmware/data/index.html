<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LQR Tuner</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121417;
    --panel: #1c1f24;
    --border: #2c3038;
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #4fa3ff;
    --ok: #3ecf6e;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bad);
  }
  .dot.connected { background: var(--ok); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .row:last-child { margin-bottom: 0; }
  .row label {
    flex: 0 0 130px;
    font-size: 0.9rem;
  }
  .row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .row output {
    flex: 0 0 70px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
  }
  .row input[type="number"] {
    width: 90px;
    background: #0e1013;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button {
    background: var(--accent);
    color: #041017;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.paused { background: var(--bad); color: #200404; }
  button.secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  select {
    flex: 1;
    background: #0e1013;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.9rem;
  }
  .note {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 8px 0 0;
  }

  .joystick-wrap {
    display: flex;
    justify-content: center;
    padding: 8px 0 4px;
  }
  .joystick-pad {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #0e1013;
    border: 1px solid var(--border);
    touch-action: none;
    user-select: none;
  }
  .joystick-nub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <h1>LQR Tuner</h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Connecting...</span>
  </div>

  <div class="panel">
    <h2>Gains (K)</h2>
    <div class="row"><label for="K0">K0 wheel disp.</label><input type="range" id="K0" min="-20" max="20" step="0.01"><output id="K0-val"></output></div>
    <div class="row"><label for="K1">K1 tilt angle</label><input type="range" id="K1" min="-30" max="30" step="0.01"><output id="K1-val"></output></div>
    <div class="row"><label for="K2">K2 yaw angle</label><input type="range" id="K2" min="-20" max="20" step="0.01"><output id="K2-val"></output></div>
    <div class="row"><label for="K3">K3 wheel vel.</label><input type="range" id="K3" min="-2" max="2" step="0.001"><output id="K3-val"></output></div>
    <div class="row"><label for="K4">K4 tilt vel.</label><input type="range" id="K4" min="-3" max="3" step="0.001"><output id="K4-val"></output></div>
    <div class="row"><label for="K5">K5 yaw vel.</label><input type="range" id="K5" min="-2" max="2" step="0.001"><output id="K5-val"></output></div>
  </div>

  <div class="panel">
    <h2>Setpoints</h2>
    <div class="row"><label for="angleSetPoint">Angle setpoint (deg)</label><input type="range" id="angleSetPoint" min="-20" max="20" step="0.1"><output id="angleSetPoint-val"></output></div>
    <div class="row"><label for="angleSetPointFine">Fine adjust</label><input type="range" id="angleSetPointFine" min="-1" max="1" step="0.01" value="0"><output id="angleSetPointFine-val">+0.00</output></div>
    <div class="row"><label for="deactivationAngle">Deactivation (deg)</label><input type="range" id="deactivationAngle" min="0" max="90" step="1"><output id="deactivationAngle-val"></output></div>
    <div class="row"><label for="alpha">Filter alpha</label><input type="range" id="alpha" min="0.9" max="1" step="0.0001"><output id="alpha-val"></output></div>
  </div>

  <div class="panel">
    <h2>Drive gains</h2>
    <div class="row"><label for="turnCurrentGain">Turn gain (A)</label><input type="range" id="turnCurrentGain" min="0" max="1" step="0.01"><output id="turnCurrentGain-val"></output></div>
    <div class="row"><label for="moveCurrentGain">Move gain (A)</label><input type="range" id="moveCurrentGain" min="0" max="1" step="0.01"><output id="moveCurrentGain-val"></output></div>
  </div>

  <div class="panel">
    <h2>Rates (applied after reboot)</h2>
    <div class="row"><label for="IMUsampleRate">IMU / control rate (Hz)</label><input type="number" id="IMUsampleRate" min="50" max="1000" step="10"></div>
  </div>

  <button id="pauseBtn">Pause</button>

  <div class="panel">
    <h2>Controller input</h2>
    <div class="row">
      <label for="gamepadSelect">Device</label>
      <select id="gamepadSelect">
        <option value="-1">Touch joystick only</option>
      </select>
      <button type="button" id="gamepadRescan" class="secondary">Rescan</button>
    </div>
    <p class="note" id="gamepadNote">No controller detected — press a button on it, then hit Rescan.</p>
  </div>

  <div class="panel">
    <h2>Drive joystick</h2>
    <div class="joystick-wrap">
      <div class="joystick-pad" id="joystickPad">
        <div class="joystick-nub" id="joystickNub"></div>
      </div>
    </div>
  </div>

<script>
const fields = ["K0","K1","K2","K3","K4","K5","angleSetPoint","deactivationAngle","alpha","turnCurrentGain","moveCurrentGain"];
const rateFields = ["IMUsampleRate"];
let ws;
let paused = false;
let activeField = null; // field currently being dragged, skip remote updates for it

const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const pauseBtn = document.getElementById("pauseBtn");

// --- WebSocket with reconnect + staleness watchdog ---
// Build the URL from location.host: the firmware always redirects to the IP,
// so this is 192.168.4.1 whether opened in the portal sheet or a browser.
// The firmware sends a {"hb":1} heartbeat every second; if we hear nothing
// for STALE_MS the socket is presumed dead (portal sheets, especially on
// iOS, can freeze a socket without ever firing 'close') and is recycled.
const STALE_MS = 3500;
let retryDelay = 500, retryTimer = null, lastMsg = 0;

function scheduleReconnect() {
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 5000); // exponential backoff, capped
}

function connect() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  statusText.textContent = "Connecting...";
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    retryDelay = 500;
    lastMsg = Date.now();
    dot.classList.add("connected");
    statusText.textContent = "Connected";
  };

  ws.onclose = () => {
    dot.classList.remove("connected");
    statusText.textContent = "Disconnected - retrying...";
    scheduleReconnect();
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (evt) => {
    lastMsg = Date.now();
    let state;
    try { state = JSON.parse(evt.data); } catch (e) { return; }
    if (!state.K) return; // heartbeat or other non-state message
    fields.forEach((f, idx) => {
      if (f === activeField) return;
      const el = document.getElementById(f);
      const val = f.startsWith("K") ? state.K[Number(f[1])] : state[f];
      el.value = val;
      document.getElementById(f + "-val").textContent = formatVal(val);
    });
    rateFields.forEach(f => {
      if (f === activeField) return;
      document.getElementById(f).value = state[f];
    });
    paused = state.paused;
    updatePauseButton();
  };
}

setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN && Date.now() - lastMsg > STALE_MS) ws.close();
}, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) connect(); // no-op if already open/connecting
});

function formatVal(v) {
  return Number(v).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
}

function sendSet(key, value) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ cmd: "set", key, value: Number(value) }));
  }
}

function updatePauseButton() {
  pauseBtn.textContent = paused ? "Resume" : "Pause";
  pauseBtn.classList.toggle("paused", paused);
}

[...fields, ...rateFields].forEach(f => {
  const el = document.getElementById(f);
  el.addEventListener("focus", () => activeField = f);
  el.addEventListener("blur", () => activeField = null);
  el.addEventListener("input", () => {
    if (fields.includes(f)) {
      document.getElementById(f + "-val").textContent = formatVal(el.value);
    }
    sendSet(f, el.value);
  });
});

// --- Angle setpoint fine adjust ---
// The main slider spans -20..20deg, so each pixel of drag is worth far more
// than the 0.1deg the setpoint is sensitive to. This slider instead acts as
// a small relative nudge (+/-1deg, 0.01deg steps) applied on top of whatever
// the main slider reads when the drag starts, then re-centers to 0 once
// released so it's always ready for another nudge in either direction.
const angleMain = document.getElementById("angleSetPoint");
const angleFine = document.getElementById("angleSetPointFine");
const angleFineVal = document.getElementById("angleSetPointFine-val");
let angleFineBase = 0;

function formatFine(v) {
  const n = Number(v);
  return (n >= 0 ? "+" : "") + n.toFixed(2);
}

function angleFineStart() {
  activeField = "angleSetPoint"; // block remote sync of the main slider mid-drag
  angleFineBase = Number(angleMain.value);
}

function angleFineEnd() {
  activeField = null;
  angleFine.value = 0;
  angleFineVal.textContent = formatFine(0);
}

angleFine.addEventListener("pointerdown", angleFineStart);
angleFine.addEventListener("focus", angleFineStart);
angleFine.addEventListener("pointerup", angleFineEnd);
angleFine.addEventListener("pointercancel", angleFineEnd);
angleFine.addEventListener("blur", angleFineEnd);
angleFine.addEventListener("input", () => {
  const target = Math.min(20, Math.max(-20, angleFineBase + Number(angleFine.value)));
  angleMain.value = target;
  document.getElementById("angleSetPoint-val").textContent = formatVal(target);
  angleFineVal.textContent = formatFine(angleFine.value);
  sendSet("angleSetPoint", target);
});

pauseBtn.addEventListener("click", () => {
  paused = !paused;
  updatePauseButton();
  sendSet("paused", paused ? 1 : 0);
});

// --- Joystick ---
// The firmware zeros drive input if it doesn't hear from us for 300ms, so
// besides sending on every move, a keep-alive interval re-sends the current
// position while held still (pointermove only fires on actual movement).
const joystickPad = document.getElementById("joystickPad");
const joystickNub = document.getElementById("joystickNub");
const JOYSTICK_KEEPALIVE_MS = 100;
let joyX = 0, joyY = 0, joyDragging = false, joyTimer = null;

function joystickPosFromEvent(e) {
  const rect = joystickPad.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let x = (e.clientX - cx) / (rect.width / 2);
  let y = (e.clientY - cy) / (rect.height / 2);
  const mag = Math.hypot(x, y);
  if (mag > 1) { x /= mag; y /= mag; }
  return { x, y: -y }; // invert so up = forward = +1
}

function updateNub(x, y) {
  const radius = joystickPad.clientWidth / 2;
  joystickNub.style.left = `calc(50% + ${x * radius}px)`;
  joystickNub.style.top = `calc(50% + ${-y * radius}px)`;
}

function sendJoystick() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ cmd: "joystick", x: joyX, y: joyY }));
  }
}

function joystickDown(e) {
  joystickPad.setPointerCapture(e.pointerId);
  joyDragging = true;
  const p = joystickPosFromEvent(e);
  joyX = p.x; joyY = p.y;
  updateNub(joyX, joyY);
  sendJoystick();
  if (!joyTimer) joyTimer = setInterval(sendJoystick, JOYSTICK_KEEPALIVE_MS);
}

function joystickMove(e) {
  if (!joyDragging) return;
  const p = joystickPosFromEvent(e);
  joyX = p.x; joyY = p.y;
  updateNub(joyX, joyY);
  sendJoystick();
}

function joystickUp() {
  if (!joyDragging) return;
  joyDragging = false;
  joyX = 0; joyY = 0;
  updateNub(0, 0);
  sendJoystick();
  clearInterval(joyTimer);
  joyTimer = null;
}

joystickPad.addEventListener("pointerdown", joystickDown);
joystickPad.addEventListener("pointermove", joystickMove);
joystickPad.addEventListener("pointerup", joystickUp);
joystickPad.addEventListener("pointercancel", joystickUp);

// --- Gamepad controller ---
// Stick axes have no "changed" event, so a connected pad is polled on a
// timer instead of read via rAF, to avoid flooding the socket every frame.
// 20ms (50Hz) matches the classic RC PWM/PPM control-frame rate - fast
// enough to feel instant and not meaningfully faster than motorSendRate
// can actually consume.
const GAMEPAD_POLL_MS = 20;
const GAMEPAD_DEADZONE = 0.08;
const GAMEPAD_ID_KEY = "lqrTuner.gamepadId";
const gamepadSelect = document.getElementById("gamepadSelect");
const gamepadRescan = document.getElementById("gamepadRescan");
const gamepadNote = document.getElementById("gamepadNote");
let selectedGamepadIndex = -1;

// Captive-portal browsers may have no (or a throwing) localStorage and may
// lack the Gamepad API, so every access goes through these guards. Without
// them one exception here would stop the rest of the script running.
function storageGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
function getPads() {
  try { return navigator.getGamepads ? (navigator.getGamepads() || []) : []; } catch (e) { return []; }
}

function stopGamepadDrive() {
  selectedGamepadIndex = -1;
  gamepadSelect.value = "-1";
  if (!joyDragging) {
    joyX = 0; joyY = 0;
    updateNub(0, 0);
    sendJoystick();
  }
}

function refreshGamepadList() {
  const pads = getPads();
  const rememberedId = storageGet(GAMEPAD_ID_KEY);
  const stillConnected = selectedGamepadIndex !== -1 && pads[selectedGamepadIndex];

  gamepadSelect.innerHTML = '<option value="-1">Touch joystick only</option>';
  let found = 0;
  let rememberedIndex = -1;
  for (let i = 0; i < pads.length; i++) {
    const gp = pads[i];
    if (!gp) continue;
    found++;
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `${i}: ${gp.id}`;
    gamepadSelect.appendChild(opt);
    if (gp.id === rememberedId) rememberedIndex = i;
  }

  if (stillConnected) {
    gamepadSelect.value = String(selectedGamepadIndex);
  } else if (selectedGamepadIndex !== -1) {
    stopGamepadDrive(); // the selected pad disappeared
  } else if (rememberedIndex !== -1) {
    selectedGamepadIndex = rememberedIndex;
    gamepadSelect.value = String(rememberedIndex);
  }

  gamepadNote.textContent = found
    ? `${found} controller${found > 1 ? "s" : ""} detected.`
    : "No controller detected — press a button on it, then hit Rescan.";
}

gamepadSelect.addEventListener("change", () => {
  const idx = Number(gamepadSelect.value);
  if (idx === -1) {
    stopGamepadDrive();
    return;
  }
  selectedGamepadIndex = idx;
  const gp = getPads()[idx];
  if (gp) storageSet(GAMEPAD_ID_KEY, gp.id);
});

gamepadRescan.addEventListener("click", refreshGamepadList);
window.addEventListener("gamepadconnected", refreshGamepadList);
window.addEventListener("gamepaddisconnected", refreshGamepadList);

function pollGamepadDrive() {
  if (selectedGamepadIndex === -1) return;
  if (joyDragging) return; // touch joystick wins while it's actively held

  const gp = getPads()[selectedGamepadIndex];
  if (!gp || gp.connected === false) {
    stopGamepadDrive();
    refreshGamepadList();
    return;
  }

  let x = gp.axes[0] || 0;
  let y = -(gp.axes[1] || 0);
  const mag = Math.hypot(x, y);
  if (mag < GAMEPAD_DEADZONE) { x = 0; y = 0; }
  else if (mag > 1) { x /= mag; y /= mag; }

  joyX = x; joyY = y;
  updateNub(joyX, joyY);
  sendJoystick();
}

connect(); // first, so nothing below can prevent the socket coming up
refreshGamepadList();
setInterval(pollGamepadDrive, GAMEPAD_POLL_MS);
</script>
</body>
</html>
