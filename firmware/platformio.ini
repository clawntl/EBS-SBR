; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Flash over USB:          pio run -e waveshare_esp32_s3_zero -t upload
; Flash over WiFi (OTA), once this firmware is running and the robot has
; joined the same network as your computer ("Access point only" off):
;                          pio run -e ota -t upload --upload-port balancebot-xxxxxx.local
; (xxxxxx = the robot's suffix, shown on the web page's Info tab.)
;
; The web page (data/index.html) is compiled into the firmware by
; scripts/embed_web.py, so there is no separate filesystem upload.

[platformio]
default_envs = waveshare_esp32_s3_zero

[env]
; Pinned: pioarduino 55.03.312 = Arduino core 3.3.12 / ESP-IDF 5.5.5 / GCC 14.2.
; The platform release pins the framework and toolchain packages itself.
; Do NOT use the ".../download/stable/..." URL: it moves (it went to Arduino 4.0 /
; IDF 6.1 in Nov 2026, which NimBLE-Arduino 2.5.2 doesn't build on).
; Needs PlatformIO Core >= 6.2.0 (a "6.2.0-post.1" build counts as older; see README).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = waveshare_esp32_s3_zero
framework = arduino
board_build.mcu = esp32s3
; Two ~1.9 MB app slots (needed for OTA, with room for Bluetooth later).
; NVS is at the same place as in default.csv, so saved settings survive the
; switch, but changing the partition table needs one USB flash.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
debug_tool = esp-builtin
debug_init_break = tbreak setup
lib_archive = false
; Converts data/index.html into a gzipped C array before each build.
extra_scripts = pre:scripts/embed_web.py
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=2
	; Keep the async web server off core 1, which runs the control tasks.
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=0
; Every dependency is pinned to an exact version or commit so that a fresh
; install builds the same firmware as a known-good one. Bump deliberately.
; GFX and BusIO are listed before SSD1306 so its unversioned dependency on
; "Adafruit GFX Library" is already satisfied and doesn't pull in GFX 2.x.
lib_deps =
	; ACAN-ESP32FD has no release tags, so it's pinned to a commit (main as of Nov 2026).
	https://github.com/clawntl/ACAN-ESP32FD.git#b955866f07ebe36f57f9880af0c3bbf7963197ae
	ESP32Async/AsyncTCP @ 3.6.1
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	bblanchon/ArduinoJson @ 7.4.3
	adafruit/Adafruit BusIO @ 1.17.4
	adafruit/Adafruit GFX Library @ 1.13.0
	adafruit/Adafruit SSD1306 @ 2.5.17
	; BLE Xbox controller (src/Gamepad.cpp). Git release tags.
	https://github.com/h2zero/NimBLE-Arduino.git#2.5.2
	https://github.com/asukiaaa/arduino-XboxControllerNotificationParser.git#1.0.5
	https://github.com/asukiaaa/arduino-XboxSeriesXHIDReportBuilder.git#1.0.1
	https://github.com/asukiaaa/arduino-XboxSeriesXControllerESP32.git#1.1.3

[env:waveshare_esp32_s3_zero]
; USB. PlatformIO auto-detects the port.

[env:ota]
upload_protocol = espota
; Pass the robot's address with --upload-port (see the top of this file).
; Must match OTA_PASSWORD in include/Config.h
upload_flags =
	--auth=balancebot
