; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared settings applied to every [env:*] below (PlatformIO merges this
; automatically). Per-side environments only need to add the IS_LEFT_MOTOR
; flag, so `pio run -e left -t upload` / `pio run -e right -t upload` (or the
; environment picker in the PlatformIO IDE toolbar) selects which motor's
; firmware gets built/flashed without touching main.cpp.
[env]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
upload_protocol = dfu
;upload_protocol = stlink

lib_archive = false

build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="Unknown"
	-D USB_PRODUCT="\"G4321\""
	-D HAL_PCD_MODULE_ENABLED
	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_CORDIC_MODULE_ENABLED

	-DHSE_VALUE=16000000

	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF

lib_deps =
	askuric/Simple FOC@^2.3.4
	simplefoc/SimpleFOCDrivers@^1.0.8

[env:left]
build_flags =
	${env.build_flags}
	-D IS_LEFT_MOTOR

[env:right]
build_flags = ${env.build_flags}

